name: Notebook public tests

on:
  push:
    tags: ["submit/lab01/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install dependencies and register kernel
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check
          python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Run all public tests
        run: python -m pytest -q --tb=short --maxfail=0 tests_public
